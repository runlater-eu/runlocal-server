service: runlocal

image: gautema/runlocal

builder:
  arch: amd64
  remote: ssh://root@10.8.1.1

servers:
  web:
    hosts:
      - 10.8.1.1
    options:
      ulimit: nofile=65536:65536
      cpu-shares: 128
      memory: 512m
      volume: runlocal-data:/home/app/data

proxy:
  ssl:
    certificate_pem: SSL_CERTIFICATE
    private_key_pem: SSL_PRIVATE_KEY
  hosts:
    - runlocal.eu
    - "*.runlocal.eu"
  app_port: 4000
  healthcheck:
    path: /

registry:
  server: ghcr.io
  username: gautema
  password:
    - KAMAL_REGISTRY_PASSWORD

env:
  clear:
    PHX_HOST: runlocal.eu
    BASE_DOMAIN: runlocal.eu
    PORT: 4000
    MIX_ENV: prod
    SUBDOMAIN_MODE: runlater
    LANDING_PAGE: "true"
    # The "runlater.eu" hostname is aliased on the Kamal Docker network to the
    # runlater-web container, which only listens on plain HTTP :4000. Pin the
    # verify-tunnel call to that internal endpoint so it doesn't try TLS :443.
    RUNLATER_API_URL: http://runlater.eu:4000
    # Hosting providers with a history of tunnel abuse:
    # 57043 = HOSTKEY (Aug 2026 Telegram-gifts marketplace),
    # 210644 = Aeza (Jul 2026 Telegram casino)
    BLOCKED_TUNNEL_ASNS: "57043,210644"
  secret:
    - SECRET_KEY_BASE
